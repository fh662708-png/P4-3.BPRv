<!-- Importação dos módulos do Firebase (v10 JS SDK) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // SUAS CONFIGURAÇÕES DO FIREBASE (Substitua pelos seus dados)
  const firebaseConfig = {
    apiKey: "SUA_API_KEY",
    authDomain: "SEU_PROJETO.firebaseapp.com",
    databaseURL: "https://SEU_PROJETO-default-rtdb.firebaseio.com",
    projectId: "SEU_PROJETO",
    storageBucket: "SEU_PROJETO.appspot.com",
    messagingSenderId: "123456789",
    appId: "1:123456789:web:abcdef"
  };

  // Inicialização
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // Referências do Banco de Dados
  const solicitacoesRef = ref(db, 'solicitacoes');
  const estoqueRef = ref(db, 'estoque');
  const solicitantesRef = ref(db, 'solicitantes');

  // Variáveis Globais
  window.SENHA_ADM = "3Bprv";
  window.isAdmin = false;
  window.itensCarrinho = [];
  window.solicitacoes = [];
  window.estoque = [];
  window.solicitantesCadastrados = [];

  // SINCRONIZAÇÃO EM TEMPO REAL (Realtime Listeners)
  onValue(solicitacoesRef, (snapshot) => {
    const data = snapshot.val();
    window.solicitacoes = data ? Object.keys(data).map(key => ({ idFirebase: key, ...data[key] })) : [];
    atualizarTabela();
    gerarRelatorio();
  });

  onValue(estoqueRef, (snapshot) => {
    const data = snapshot.val();
    window.estoque = data ? Object.keys(data).map(key => ({ idFirebase: key, ...data[key] })) : [];
    atualizarTabelaEstoque();
    popularSelectItens();
  });

  onValue(solicitantesRef, (snapshot) => {
    const data = snapshot.val();
    window.solicitantesCadastrados = data ? Object.values(data) : ['Bop/1', 'Bop/2', 'Bop/3', 'P1', 'P2', 'P3', 'P4'];
    atualizarSelectSolicitantes();
    popularFiltroSolicitantes();
    renderizarListaSolicitantesGerenciamento();
  });

  // FUNÇÕES DE PERSISTÊNCIA NO FIREBASE
  window.cadastrarNovoSolicitante = function(e) {
    e.preventDefault();
    if (!isAdmin) return;
    const nome = document.getElementById('novoSolicitanteNome').value.trim();
    if (nome && !window.solicitantesCadastrados.includes(nome)) {
      push(solicitantesRef, nome);
      document.getElementById('novoSolicitanteNome').value = '';
    }
  };

  window.alterarStatus = function(idFirebase) {
    if (!isAdmin) return;
    const item = window.solicitacoes.find(s => s.idFirebase === idFirebase);
    if (item) {
      const novoStatus = item.status === "Pendente" ? "Entregue" : "Pendente";
      update(ref(db, `solicitacoes/${idFirebase}`), { status: novoStatus });
    }
  };

  document.getElementById('solicitacaoForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const base = document.getElementById('solicitanteBase').value;
    const re = document.getElementById('solicitanteRE').value.trim();

    if (!base || window.itensCarrinho.length === 0) return;

    const novaSolicitacao = {
      solicitanteBase: base,
      solicitanteRE: re,
      solicitante: `${base} - RE ${re}`,
      item: window.itensCarrinho.map(i => `${i.item} (x${i.quantidade})`).join(', '),
      quantidade: window.itensCarrinho.reduce((acc, curr) => acc + curr.quantidade, 0),
      data: document.getElementById('data').value,
      status: "Pendente",
      timestamp: Date.now()
    };

    push(solicitacoesRef, novaSolicitacao);
    fecharModalSolicitacao();
  });
</script>
